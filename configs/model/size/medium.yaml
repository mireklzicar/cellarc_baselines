# @package model.size
size: medium
variants:
  rnn:
    hidden_size: 512
  transformer:
    embedding_dim: 160
    num_layers: 2
    num_heads: 5
    dropout_prob: 0.1
    widening_factor: 2
  cnn1d:
    embedding_dim: 160
    hidden_channels: 320
    num_layers: 4
    dropout: 0.1
  nca1d:
    channel_size: 192
    hidden_size: 1536
    num_steps: 64
    num_kernels: 2
    kernel_size: 3
    cell_dropout_rate: 0.1
    input_embedding_dim: 96
  tiny_recursive:
    name: recursive_reasoning.trm@TinyRecursiveReasoningModel_ACTV1
    loss:
      name: losses@ACTLossHead
      loss_type: stablemax_cross_entropy
    halt_exploration_prob: 0.1
    halt_max_steps: 16
    H_cycles: 3
    L_cycles: 6
    H_layers: 0
    L_layers: 2
    hidden_size: 192
    num_heads: 4
    expansion: 2.3
    puzzle_emb_ndim: ${.hidden_size}
    pos_encodings: rope
    forward_dtype: bfloat16
    mlp_t: false
    puzzle_emb_len: 12
    no_ACT_continue: true
  hrm:
    name: recursive_reasoning.hrm@HierarchicalReasoningModel_ACTV1
    loss:
      name: losses@ACTLossHead
      loss_type: stablemax_cross_entropy
    halt_exploration_prob: 0.1
    halt_max_steps: 16
    H_cycles: 2
    L_cycles: 2
    H_layers: 4
    L_layers: 4
    hidden_size: 96
    num_heads: 4
    expansion: 2.0
    puzzle_emb_ndim: ${.hidden_size}
    pos_encodings: rope
    forward_dtype: bfloat16
    mlp_t: false
