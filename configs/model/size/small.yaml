# @package model.size
size: small
variants:
  rnn:
    hidden_size: 160
  transformer:
    embedding_dim: 56
    num_layers: 2
    num_heads: 4
    dropout_prob: 0.1
    widening_factor: 1
  cnn1d:
    embedding_dim: 64
    hidden_channels: 160
    num_layers: 2
    dropout: 0.1
  nca1d:
    channel_size: 80
    hidden_size: 320
    num_steps: 48
    num_kernels: 2
    kernel_size: 3
    cell_dropout_rate: 0.1
    input_embedding_dim: 48
  tiny_recursive:
    name: recursive_reasoning.trm@TinyRecursiveReasoningModel_ACTV1
    loss:
      name: losses@ACTLossHead
      loss_type: stablemax_cross_entropy
    halt_exploration_prob: 0.1
    halt_max_steps: 16
    H_cycles: 3
    L_cycles: 6
    H_layers: 0
    L_layers: 2
    hidden_size: 64
    num_heads: 4
    expansion: 1.8
    puzzle_emb_ndim: ${.hidden_size}
    pos_encodings: rope
    forward_dtype: bfloat16
    mlp_t: false
    puzzle_emb_len: 8
    no_ACT_continue: true
  hrm:
    name: recursive_reasoning.hrm@HierarchicalReasoningModel_ACTV1
    loss:
      name: losses@ACTLossHead
      loss_type: stablemax_cross_entropy
    halt_exploration_prob: 0.1
    halt_max_steps: 16
    H_cycles: 2
    L_cycles: 2
    H_layers: 4
    L_layers: 4
    hidden_size: 24
    num_heads: 4
    expansion: 1.1
    puzzle_emb_ndim: ${.hidden_size}
    pos_encodings: rope
    forward_dtype: bfloat16
    mlp_t: false
