# @package _global_
defaults:
  - /model/size: small
  - _self_

seed: 1337

dataset:
  benchmark: cellarc_100k
  train_split: train
  eval_splits: [val]
  test_splits: [test_interpolation, test_extrapolation]
  include_metadata: false
  root: null

data:
  batch_size: 64
  num_workers: 0
  max_seq_len: 272
  drop_long_episodes: false
  shuffle: true
  shuffle_buffer: 1024
  augmentation:
    enabled: true
    reverse_prob: 0.5
    palette: null

tokens:
  num_colors: 10
  pad_id: 10
  support_input_id: 11
  support_output_id: 12
  query_id: 13
  target_id: 14
  mask_id: 15
  eos_id: 16

model:
  architecture: rnn
  dtype: float32
  device: auto

optimizer:
  name: adamw
  lr: 0.0005
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1e-8
  warmup_steps: 0

trainer:
  num_epochs: 10
  max_steps: null
  eval_every: null
  log_every: 50
  gradient_accumulation: 1
  clip_grad_norm: null
  max_eval_episodes: 256

loss:
  ignore_index: -100

eval:
  batch_size: 64
  limit: null

test:
  batch_size: 64
  limit: null

logging:
  wandb:
    enabled: false
    project: cellarc_baselines
    entity: null
    group: null
    name: null
    tags: []
    log_model: false
