# @package _global_
defaults:
  - default
  - _self_

dataset:
  train_split: val
  train_eval_splits: []
  eval_splits: [val]
  test_splits: [test_interpolation, test_extrapolation]

data:
  batch_size: 2
  max_seq_len: 272
  augmentation:
    enabled: false

trainer:
  num_epochs: null
  max_steps: 5
  eval_every: 5
  log_every: 1
  max_eval_episodes: 8

eval:
  batch_size: 2
  limit: 16
  tta:
    enabled: false
    num_augs: 16
    use_palette: true
    use_reverse: true
    vote: "majority"
    apply_to: "query_only"

test:
  batch_size: 2
  limit: 16
